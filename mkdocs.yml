site_name: EL 语言参考
site_description: EL 语言、标准库与工具链参考；按主题、模块和符号查阅，附入门教程与实战指南
site_url: https://steve02081504.github.io/el-doc/
repo_url: https://github.com/steve02081504/el-doc
repo_name: steve02081504/el-doc
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 steve02081504 · 本文档按 EL 语言规范编写

theme:
  variant: classic
  language: zh
  font: false
  logo: assets/evil-illusion.svg
  favicon: assets/evil-illusion.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols

plugins:
  - search:
      lang:
        - zh
        - en

not_in_nav: |
  /404.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/steve02081504

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/code-links.js
  - assets/virtual-content.js
  - assets/random-page.js
  - assets/learning.js

nav:
  - 首页: index.md
  - 整体参考:
      - 语言参考:
          - 总览: reference/language/index.md
          - 语法、声明与表达式:
            - 词法与字面量: reference/language/lexical.md
            - 声明与绑定: reference/language/declarations.md
            - 解构绑定: reference/language/destructuring.md
            - 表达式与运算符: reference/language/expressions.md
            - 推导式与惰性生成式: reference/language/comprehensions.md
            - 控制流: reference/language/control-flow.md
          - 类型、绑定与资源:
            - 类型: reference/language/types.md
            - 泛型与约束: reference/language/generics.md
            - 左值、右值与亡值: reference/language/value-categories.md
            - 赋值、复制与共享: reference/language/assignment-semantics.md
            - 复制消除: reference/language/copy-elision.md
            - 类型转换: reference/language/conversions.md
            - 类与生命周期: reference/language/classes.md
            - 借用与清理: reference/language/lifetimes.md
            - 激进生命周期与析构时机: reference/language/aggressive-lifetimes.md
          - 函数与模块:
            - 函数: reference/language/functions.md
            - 重载解析: reference/language/overload-resolution.md
            - 模块与导入: reference/language/modules.md
            - 文件预处理: reference/language/preprocessing.md
          - 执行、扩展与底层:
            - 异常与并发: reference/language/execution.md
            - 宏与元编程: reference/language/metaprogramming.md
            - 外部接口与 ABI: reference/language/foreign.md
            - EIR 与底层源码块: reference/language/eir.md
      - 标准库 API: stdlib/api/index.md
      - 工具链与实现:
          - 命令与构建: toolchain.md
          - 规范与实现边界: appendix/implementation-status.md
  - 分领域速成手册:
