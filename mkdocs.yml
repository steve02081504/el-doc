site_name: EL 语言教程
site_description: 从第一个程序到 GUI、网页与工具链的 EL 语言教学文档
site_url: https://steve02081504.github.io/el-doc/
repo_url: https://github.com/steve02081504/el-doc
repo_name: steve02081504/el-doc
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 steve02081504 · 本文档按 EL 语言规范编写

theme:
  name: material
  language: zh
  font: false
  logo: assets/evil-illusion.svg
  favicon: assets/evil-illusion.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

hooks:
  - hooks/el_lexer.py
  - hooks/random_pages.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols

plugins:
  - search:
      lang:
        - zh
        - en

not_in_nav: |
  /404.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/steve02081504

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - assets/random-page.js
  - assets/learning.js

nav:
  - 首页: index.md
  - 学习地图: roadmap.md
  - 起步:
      - 安装与第一个程序: getting-started.md
      - 15 分钟速览: tour.md
  - 语言:
      - 语言总览: language/index.md
      - 读语言之前: language/before-you-start.md
      - 值与类型: language/values.md
      - 数值与位类型: language/numeric-types.md
      - 运算符与表达式: language/operators.md
      - 控制流: language/control-flow.md
      - 函数与闭包: language/functions.md
      - 生命周期与析构: language/lifetimes.md
      - 类与对象: language/classes.md
      - 内存布局与 GC 钩子: language/memory-layout.md
      - 模块与包: language/modules.md
      - Shell 语法: language/shell.md
      - 错误处理与异步: language/errors-async.md
      - 性能与底层优化: language/performance.md
      - 外部接口与 ABI: language/foreign.md
  - 标准库:
      - 标准库总览: stdlib/index.md
      - Console 与日志: stdlib/console.md
      - 集合与文本: stdlib/collections.md
      - 文件与网络: stdlib/files-network.md
      - 图形界面: stdlib/gui.md
      - 声音与音频: stdlib/audio.md
      - 神经网络: stdlib/neural-networks.md
      - 测试: stdlib/testing.md
  - 工具链: toolchain.md
  - 实战:
      - 命令行工具: practice/cli-tool.md
      - 图形程序: practice/gui-app.md
  - 多范式:
      - 手写 JSON 解析器: practice/json-parser.md
      - 规则式下棋机器人: practice/logic-game.md
      - 定理证明: practice/proofs.md
      - 矩阵与数值脚本: practice/numerics.md
  - 附录:
      - 从其他语言过来: appendix/coming-from.md
      - 常见问题: appendix/faq.md
      - 规范与实现边界: appendix/implementation-status.md
