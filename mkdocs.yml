          - 集合与文本: stdlib/collections.md
          - 从遍历到函数组合: stdlib/function-composition.md
          - 文件与网络: stdlib/files-network.md
          - 图形界面: stdlib/gui.md
          - 声音与音频: stdlib/audio.md
          - 神经网络: stdlib/neural-networks.md
